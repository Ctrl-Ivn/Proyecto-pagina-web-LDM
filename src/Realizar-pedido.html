<!-- cuerpo de la pagina  -->
<div id="contenedor">
    <h1>Realiza tu pedido
    </h1>



    <!-- Estructura de formulario basica -->

    <form action="procesar_pedido.php" method="POST">

        <!-- Nombre -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        <br><br>

        <!-- Correo electrónico -->
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        <br><br>

        <!-- Teléfono -->
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="634 343 323" required>
        <br><br>

        <!-- Fecha pedido -->
        <label for="fecha">Fecha del pedido:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br>

        <!-- Options -->
        <label for="producto">Producto:</label><br>
        <select id="producto" name="producto" required>
            <option value="">--Selecciona un producto--</option>
            <option value="pastel_chocolate">Pastel de chocolate</option>
            <option value="pastel_vainilla">Pastel de vainilla</option>
            <option value="croissant">Croissant</option>
            <option value="galletas">Galletas</option>
        </select><br><br>
        <!-- Radios pepitas de chocolate -->
        <p>¿Quieres pepitas de chocolate?</p>
        <input type="radio" id="si" name="pepitas" value="si" required>
        <label for="si">Sí</label><br>

        <input type="radio" id="no" name="pepitas" value="no" checked required>
        <label for="no">No</label>
        <br><br>

        <!-- Cantidad -->
        <label for="cantidad">Cantidad:</label><br>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1" required><br><br>

        <!-- Comentarios -->
        <label for="comentarios">Comentarios adicionales:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="30"
            placeholder="Ej: Sin azúcar, decoraciones especiales..."></textarea><br>

        <!-- Botones -->
        <input type="submit" value="Enviar Pedido">
        <input type="reset" value="Borrar Formulario">
    </form>

    <footer>

            <br>
